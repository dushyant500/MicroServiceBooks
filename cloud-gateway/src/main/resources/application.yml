spring:
  application:
    name: GATEWAY-SERVICE
    Content-Type: application/json

  cloud:
    gateway:
      routes:
        - id: bookms
          uri: lb://bookms
          predicates:
            - Path=/book-lib/**
        - id: issuerms
          uri: lb://issuerms
          predicates:
            - Path=/issuer/**
    
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    hostname: localhost
    
    
server:  port: 8989